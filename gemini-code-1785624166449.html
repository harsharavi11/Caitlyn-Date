<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question for Caitlyn...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .hero-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #fff0f5;
    }

    h1 {
      color: #2d3748;
      font-size: 1.75rem;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: #718096;
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
      text-align: left;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background-color: #f7fafc;
      border: 2px solid #edf2f7;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-item:hover {
      border-color: #fbc2eb;
      background-color: #fdf2f8;
    }

    .option-item input {
      margin-right: 12px;
      accent-color: #e879f9;
    }

    .option-item label {
      cursor: pointer;
      font-size: 0.95rem;
      color: #4a5568;
      font-weight: 500;
      width: 100%;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .yes-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .yes-btn:hover {
      transform: scale(1.05);
    }

    .no-btn {
      background-color: #edf2f7;
      color: #718096;
      position: absolute;
      right: 40px;
    }

    #success-screen {
      display: none;
    }

    #success-screen h2 {
      color: #2d3748;
      margin-bottom: 12px;
    }

    #success-screen p {
      color: #4a5568;
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Main Form Screen -->
    <div id="invite-screen">
      <!-- Ice Cream GIF -->
      <img class="hero-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHR6MnJ4dmptdHZ2bXNhd2YxbXBvdTFqMmZsOWRybHBjOHlsZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/dMsh6gRYJDymXSIvtn/giphy.gif" alt="Ice Cream GIF">
      
      <h1>Hey Caitlyn! 🍦</h1>
      <p class="subtitle">I've really enjoyed chatting with you. Let me treat you to ice cream this week!</p>

      <div class="options-grid">
        <div class="option-item">
          <input type="radio" id="opt1" name="ice_cream_type" value="Classic Waffle Cone" checked>
          <label for="opt1">🍦 Classic Waffle Cone</label>
        </div>
        <div class="option-item">
          <input type="radio" id="opt2" name="ice_cream_type" value="Sundae with Extra Toppings">
          <label for="opt2">🍨 Sundae loaded with toppings</label>
        </div>
        <div class="option-item">
          <input type="radio" id="opt3" name="ice_cream_type" value="Gelato & a Walk">
          <label for="opt3">🍨 Artisanal Gelato & a walk</label>
        </div>
      </div>

      <div class="btn-group">
        <button class="yes-btn" onclick="handleYes()">I'm In! 🍦</button>
        <button class="no-btn" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
      </div>
    </div>

    <!-- Confirmation Screen -->
    <div id="success-screen">
      <img class="hero-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnFlMnY3dTB5Zml4aXl5aWp6aDRtdnhjd3BmM3BiaGN6aXU5cHFxOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L1UrpHiGD9M4ypuPJS/giphy.gif" alt="Happy GIF">
      <h2>It's a date, Caitlyn! 🎉</h2>
      <p id="selected-choice-text"></p>
    </div>
  </div>

  <script>
    function dodgeNo() {
      const noBtn = document.getElementById('noBtn');
      
      // Calculate random translation offsets to jump the 'No' button
      const randomX = (Math.random() - 0.5) * 250;
      const randomY = (Math.random() - 0.5) * 250;
      
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    function handleYes() {
      const selectedOption = document.querySelector('input[name="ice_cream_type"]:checked').value;
      
      document.getElementById('invite-screen').style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
      
      document.getElementById('selected-choice-text').innerText = 
        `Awesome! You picked "${selectedOption}". Reply in our chat with your availability so we can plan where to go!`;
    }
  </script>

</body>
</html>
